# =========================================================
# APPLICATION
# =========================================================
spring.application.name=digishop

# Railway cung cấp PORT tự động
# Local sẽ chạy port 8080
server.port=${PORT:8080}


# =========================================================
# DATABASE - MYSQL
# =========================================================
# Local:
# jdbc:mysql://localhost:3306/digishop
#
# Railway:
# DB_URL sẽ được cấu hình trong Railway Variables
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/digishop?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}

# HikariCP - Database Connection Pool
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT:600000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME:1800000}


# =========================================================
# JWT
# =========================================================
app.jwt.secret=${JWT_SECRET:change-this-to-a-long-random-secret-please-32bytes-min}
app.jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}


