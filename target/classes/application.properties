# =========================================================
# APPLICATION
# =========================================================
spring.application.name=digishop

# Railway/Render cung cap PORT tu dong qua bien moi truong PORT
# Local se chay port 8080
server.port=${PORT:8080}
#server.port=${PORT:10000}
server.address=0.0.0.0



# =========================================================
# DATABASE - MYSQL
# =========================================================
# Local:
# jdbc:mysql://localhost:3306/digishop
#
# Production: DB_URL se duoc cau hinh trong bien moi truong cua nen tang deploy
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/digishop?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}

# HikariCP - Database Connection Pool
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT:600000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME:1800000}


# =========================================================
# JWT
# =========================================================
app.jwt.secret=${JWT_SECRET:change-this-to-a-long-random-secret-please-32bytes-min}
app.jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}


# =========================================================
# GOOGLE OAUTH
# =========================================================
app.google.client-id=${GOOGLE_CLIENT_ID:779501654477-plikpdqnlkun6qcr0d571lldhch0udc5.apps.googleusercontent.com}


# =========================================================
# FACEBOOK OAUTH
# =========================================================
app.facebook.app-id=${FACEBOOK_APP_ID:911442537995759}
app.facebook.app-secret=${FACEBOOK_APP_SECRET:cc9ae5704ac1464fca6f425b3e462475}


# =========================================================
# CLOUDINARY (luu tru anh)
# =========================================================
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
app.cloudinary.api-key=${CLOUDINARY_API_KEY:}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}


# =========================================================
# MAIL - BREVO HTTP API (https://api.brevo.com/v3/smtp/email)
# =========================================================
# Doi tu Gmail SMTP sang Brevo API vi Render free tier chan outbound SMTP
# port 25/465/587. Brevo chay qua HTTPS (443) nen khong bi chan.
# BREVO_API_KEY: Brevo dashboard -> Settings -> SMTP & API -> API Keys.
# KHONG hard-code key that o day - chi set qua bien moi truong tren Render.
app.mail.brevo-api-key=${BREVO_API_KEY:}

# EmailService doc cac key nay
app.mail.enabled=${MAIL_ENABLED:true}
# fromAddress PHAI la mot sender da duoc verify trong Brevo (Transactional -> Email -> Senders)
app.mail.from=${MAIL_FROM:letanquocdat132@gmail.com}
app.mail.from-name=${MAIL_FROM_NAME:DigiShop}


# =========================================================
# FILE UPLOAD
# =========================================================
app.upload.dir=${UPLOAD_DIR:uploads}

spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:5MB}


# =========================================================
# SEPAY WEBHOOK
# =========================================================
app.sepay.api-key=${SEPAY_API_KEY:RBS1DVYMXKVZU4NHASFLZTD9QJBQKASVTTFGY8VQMNBO39JKSAIHDNI5IELJGDXO}


# =========================================================
# LOGGING
# =========================================================
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.khoaluan=${LOG_LEVEL_APP:INFO}
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:INFO}


# =========================================================
# CHARACTER ENCODING
# =========================================================
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true